name: CI

# Laeuft bei jedem Push und bei jedem Pull Request. Schlaegt die Pruefung fehl,
# laesst sich der Pull Request nicht zusammenfuehren und es wird nichts
# veroeffentlicht.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefung:
    name: Statische Pruefung und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Statische Pruefung
        run: |
          ruff check .
          ruff format --check .

      - name: Django-Systemcheck
        # Die Anwendung startet ohne SECRET_KEY nicht, sobald der
        # Fehlersuchmodus aus ist. Fuer die Pruefung wird deshalb ein
        # Schluessel erzeugt, der nur in diesem Lauf existiert. Geprueft wird
        # zusaetzlich mit --deploy, also gegen dieselben Anforderungen, die
        # in der Produktion gelten.
        run: |
          export SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(64))")
          python manage.py check
          python manage.py check --deploy

      - name: Tests
        run: pytest --cov=plants --cov-report=term-missing

  veroeffentlichung:
    name: Veroeffentlichung auf Railway
    # Qualitaetstor: Dieser Schritt startet nur, wenn die Pruefung vollstaendig
    # bestanden wurde. Ein fehlgeschlagener Test verhindert die Auslieferung.
    needs: pruefung
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Railway-Kommandozeile installieren
        run: npm install -g @railway/cli

      - name: Veroeffentlichen
        run: railway up --service Studienprojekt-ISEF01 --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
